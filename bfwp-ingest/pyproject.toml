[project]
name = "bfwp-ingest"
version = "0.1.0"
description = "HiveMQ subscriber and SQLite writer for BFWP"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "jsonschema>=4", "paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bfwp-ingest = "bfwp_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
