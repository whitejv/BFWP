; Starter config — board to be confirmed when hardware is chosen.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson

; Host-side tests for hardware-independent logic (event rules, seq, buffering).
[env:native]
platform = native
test_framework = unity
