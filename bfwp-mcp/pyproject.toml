[project]
name = "bfwp-mcp"
version = "0.1.0"
description = "Read-only MCP tools over BFWP well databases"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bfwp-mcp = "bfwp_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
