name: cadence_off_hours
description: >
  Activity-based publishing cadence. A low-flow zone runs at an unusual hour (05:10), so the
  pump cycles off for minutes at a time while water keeps flowing through the meter — the device
  must stay in active mode. After the run it returns to idle after the 2-minute hold. Later a
  very slow upstream leak drifts pressure down while idle, which must trigger report-on-change
  readings between the 60 s idle reports.
device: twin1
start: "2026-10-09T04:30:00-05:00"
end:   "2026-10-09T08:00:00-05:00"
speed: 0
seed: 11
system:
  pressure_switch: {cut_in: 40, cut_out: 60}
  zones: {4: {gpm: 4}}
timeline:
  - {at: "05:10", zone_on: {zone: 4, minutes: 15}}
  - {at: "06:00", leak:    {gpm: 0.05, location: upstream}}
expect:
  cadence:
    - {mode: idle,   between: ["04:30", "05:10"]}
    - {mode: active, between: ["05:10", "05:25"]}   # no idle readings anywhere in this span
    - {mode: idle,   after: "05:28"}                 # 15-min run + 2-min hold + margin
    - {report_on_change: true, after: "06:00"}       # idle readings closer than 60 s as psi drifts >= 1 psi
  events:
    - {type: pump_on, between: ["05:10", "05:13"]}
  no_events:
    - {type: sensor_fault}
  analysis:
    leak_detected: true
    leak_location: upstream
